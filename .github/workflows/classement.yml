name: Classement BEUDY
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recopier le tableau des scores du site
        run: |
          python3 - <<'PY'
          import re, json, html, urllib.request
          u='https://www.ladroguerieducbd.fr/concours-beudy.html'
          t=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 BEUDY-lb'}),timeout=30).read().decode('utf-8','ignore')
          s=t[t.find('class="bdylb"'):]
          rows=[]
          for n,sc in re.findall(r'<td class="n">(.*?)</td>\s*<td class="s">(.*?)<small',s,re.S):
              n=html.unescape(re.sub('<[^>]+>','',n)).strip(); sc=re.sub(r'[^0-9]','',html.unescape(sc))
              if not n or 'place libre' in n or not sc: continue
              rows.append({'n':n,'p':re.sub('[^A-Z0-9]','',n.upper())[:14],'s':int(sc)})
          m=re.search(r'derni(?:&egrave;|è)re mise (?:&agrave;|à) jour\s*:\s*([^<]*)',s)
          maj=html.unescape(m.group(1)).replace('à ','').strip() if m else ''
          ev=re.search(r'D[ée]fi #(\d+)',html.unescape(s)); ev='S'+(ev.group(1) if ev else '1')
          new={'ev':ev,'maj':maj,'rows':rows[:10]}
          try: old=json.load(open('lb.json'))
          except Exception: old=None
          if 'class="bdylb"' in t and old!=new:
              json.dump(new,open('lb.json','w'),ensure_ascii=False)
              print('mis à jour',new)
          else: print('inchangé')
          PY
      - name: Enregistrer
        run: |
          git config user.name "BEUDY bot"; git config user.email "bot@users.noreply.github.com"
          git add lb.json; git diff --cached --quiet || (git commit -m "Classement $(date -u +%F_%H%M)" && git push)
